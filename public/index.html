<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vote and win a prize</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Bumper Offer Vote and win</h1>
        
        <!-- Consent Notice -->
        <div class="disclaimer">
            <h3>Important Notice</h3>
            <p>Only one vote counts</p>
        </div>

        <button id="locationButton" class="btn">Vote here</button>
        
        <!-- Status Messages -->
        <div class="status">
            <div id="success" class="hidden">Thank you for your vote </div>
            <div id="error" class="hidden">vote Here.</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
